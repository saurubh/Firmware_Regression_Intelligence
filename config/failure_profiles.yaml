from_reset:
  description: >
    Unknown failure from CPU-out-of-reset through OS. Use this when the
    platform does not boot after a BIOS change and the phase is unknown.
    FRI triages every boot phase (Intel FSP and AMD AGESA/PSP) between
    the good SHA and the failing SHA.
  phase: all
  breadth: wide
  subsystems:
    - CPU
    - FIT
    - ME
    - PSP
    - Boot
    - SEC
    - PEI
    - Memory
    - FSP
    - AGESA
    - PCH
