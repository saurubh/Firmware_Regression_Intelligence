# Firmware Regression Intelligence — Failure Profiles
#
# Each profile describes one regression topic. The scorer uses
# subsystems, keywords, path patterns, and risk signals together
# so that the correct commits rise to the top.

boot:
  description: >
    Firmware/BIOS boot from reset through SEC, PEI, DXE, and BDS
    before the OS loader is started. Covers hang-at-post, no video,
    missing DXE drivers, and failed ReadyToBoot.
  subsystems:
    - Platform
    - FIT
    - Boot
    - PEI
    - DXE
    - BDS
    - FSP
    - Security
  keywords:
    - boot
    - post
    - pei
    - dxe
    - bds
    - sec
    - fsp
    - fit
    - readytoboot
    - endofdxe
    - peim
    - dxecore
    - platform
    - hang
    - reset
    - watchdog
    - timeout
  path_patterns:
    - peicore
    - dxecore
    - bdsdxe
    - platformpeim
    - fspwrapper
    - intelfsp
    - fit
    - secmain
    - reportstatuscode
    - dxeiplex
    - ufeibootmanager
  risk_signals:
    - timeout
    - pcd
    - default
    - assert
    - stall
    - watchdog
  phase: all
  breadth: wide
  related:
    - from_reset
    - reset
    - sec
    - pei
    - memory_init
    - silicon_init
    - dxe
    - bds
    - os_boot
    - fsp
    - amd_agesa

os_boot:
  description: >
    OS boot / firmware-to-OS handoff regressions. The firmware
    reaches BDS but Linux, Windows, LinuxBoot, GRUB, systemd-boot,
    or the EFI stub fails to start, panics early, or cannot see
    memory, ACPI, disks, or consoles.
  phase: os_handoff
  subsystems:
    - Boot
    - BDS
    - ACPI
    - SMBIOS
    - OSLoader
    - LinuxBoot
    - IOMMU
    - Memory
    - PCIe
    - Variable
    - Graphics
    - Network
    - Storage
  related:
    - boot
    - acpi
    - smbios
    - iommu
    - memory
    - pcie
    - variable
    - graphics
    - storage
    - network
    - linuxboot
    - secure_boot
    - measured_boot
    - numa
    - csm
    - serial
    - watchdog
    - resume
  keywords:
    - os boot
    - osboot
    - exitbootservices
    - getmemorymap
    - loadimage
    - startimage
    - bootmanager
    - bootorder
    - boot####
    - grub
    - linux
    - linuxboot
    - kernel
    - efi stub
    - efistub
    - systemd-boot
    - bootmgr
    - winload
    - shim
    - initrd
    - initramfs
    - payload
    - acpi
    - rsdp
    - dsdt
    - madt
    - srat
    - slit
    - hmat
    - dmar
    - iommu
    - memory map
    - e820
    - conventionalmemory
    - runtime
    - virtualaddress
    - setvirtualaddressmap
    - readytoboot
    - osindications
    - bootnext
    - ramdisk
    - device tree
    - fdt
  path_patterns:
    - bdsdxe
    - ufeibootmanagerlib
    - bootmanagerpolicy
    - osloader
    - linuxboot
    - grub
    - payload
    - acpitable
    - acpiplatform
    - smbios
    - pcihostbridge
    - pcibus
    - iommu
    - intelvtd
    - amd-iommu
    - memorymap
    - variableruntimedxe
    - graphicsconsole
    - consplitter
    - terminaldxe
    - ramdisk
    - httpboot
    - pxebc
  risk_signals:
    - exitbootservices
    - getmemorymap
    - setvirtualaddressmap
    - timeout
    - pcd
    - default
    - bootorder
    - "null"
    - efi_error

