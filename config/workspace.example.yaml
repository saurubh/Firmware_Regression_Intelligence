# Example pin-set for a UEFI BIOS workspace.
#
# Prefer the same BIOS tag name in every Git repo:
#   fri investigate --workspace /path/to/platform --good GOOD_BUILD_TAG --bad BAD_BUILD_TAG
#
# FRI resolves GOOD_BUILD_TAG / BAD_BUILD_TAG in platform, edk2, Intel, ...
# and falls back to .gitmodules gitlinks when a repo has no such tag.
#
# Manifest form (same tag names, or per-repo overrides):
#   fri investigate --manifest config/workspace.example.yaml --failure from_reset

workspace: /path/to/platform-superproject
good: GOOD_BUILD_TAG
bad: BAD_BUILD_TAG

repos:
  - name: platform
    path: .
  - name: edk2
    path: edk2
  - name: edk2-platforms
    path: edk2-platforms
  - name: Intel
    path: Intel
    # Optional per-repo overrides when a repo is not a submodule pin:
    # good: abcdef1
    # bad:  89abcde


