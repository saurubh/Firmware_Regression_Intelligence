debug: false

analysis:
  minimum_confidence: 25
  # Independent signals (path, keyword, hazard, boot API) raise a
  # commit even when the raw diff is small.
  workers: 4
  skip_binary_only_diffs: true

git:
  list_timeout_sec: 180
  diff_timeout_sec: 8
  path_timeout_sec: 20
  max_source_paths: 40
  max_diff_bytes: 65536
  skip_merge_diffs: true

report:
  top_candidates: 10

html:
  theme: light
