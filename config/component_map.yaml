# Firmware domain taxonomy — paths AND keywords.
#
# Matching uses token / directory boundaries (see fri.utils.matching).
# Adding a domain here is enough for classification and keyword extraction;
# add a failure profile in failure_profiles.yaml to expose it as --failure.

