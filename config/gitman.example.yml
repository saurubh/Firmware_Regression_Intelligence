# gitman.yml is only a *format*. FRI does not hardcode Edk2/Intel/Lenovo.
# It reads every sources[].name, then walks the tree for other Git repos.
#
#   fri pins --gitman ./gitman.yml --good GOOD_TAG --bad BAD_TAG
#   fri investigate --gitman ./gitman.yml --good GOOD_TAG --bad BAD_TAG --failure os_boot

location: .

sources:
  - name: Edk2
  - name: Edk2Platforms
  - name: Intel
  - name: FDBin
  - name: Lenovo/Base
  - name: Lenovo/Generation
  - name: Lenovo/Tools
  - name: Lenovo/Server
