[build-system]
requires = [
    "setuptools>=68.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# ==========================================================
# Project
# ==========================================================

[project]
name = "fri"
version = "2.1.0"
description = "Firmware Regression Intelligence Framework"
readme = "README.md"
requires-python = ">=3.10"

license = { text = "MIT" }

authors = [
    { name = "Saurabh Mishra" }
]

keywords = [
    "firmware",
    "bios",
    "uefi",
    "coreboot",
    "regression",
    "git",
    "automation",
    "analysis"
]

classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",

    "Environment :: Console",

    "Operating System :: OS Independent",

    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",

    "Programming Language :: Python :: 3.11",

    "Topic :: Software Development",

    "Topic :: Software Development :: Version Control",

    "Topic :: System :: Systems Administration"
]

dependencies = [
    "GitPython>=3.1.43",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.4",
    "rich>=13.9.4"
]

# ==========================================================
# Optional Dependencies
# ==========================================================

[project.optional-dependencies]

dev = [
    "black>=25.1.0",
    "ruff>=0.11.10",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "mypy>=1.15.0",
    "types-PyYAML>=6.0.12"
]

# ==========================================================
# Console Script
# ==========================================================

[project.scripts]

fri = "fri.main:main"

# ==========================================================
# Project URLs
# ==========================================================

[project.urls]

Homepage = "https://github.com/<your-org>/fri"

Repository = "https://github.com/<your-org>/fri"

Issues = "https://github.com/<your-org>/fri/issues"

# ==========================================================
# setuptools
# ==========================================================

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

where = ["."]

include = [
    "fri*"
]

# ==========================================================
# Black
# ==========================================================

[tool.black]

line-length = 88

target-version = [
    "py310"
]

# ==========================================================
# Ruff
# ==========================================================

[tool.ruff]

line-length = 120

target-version = "py310"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

# ==========================================================
# Pytest
# ==========================================================

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

pythonpath = [
    "."
]

addopts = "-ra"

# ==========================================================
# Coverage
# ==========================================================

[tool.coverage.run]

source = [
    "fri"
]

branch = true

[tool.coverage.report]

show_missing = true

skip_covered = true

# ==========================================================
# MyPy
# ==========================================================

[tool.mypy]

python_version = "3.10"

ignore_missing_imports = true

check_untyped_defs = true

warn_return_any = true

warn_unused_configs = true

warn_unused_ignores = true

strict_optional = true